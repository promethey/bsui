name: Deploy Documentation

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Root project (BSUI + Storybook)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install BSUI dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook -- --output-dir storybook

      # Docusaurus
      - name: Build documentation
        run: npm run www:build

      - name: Merge Storybook
        run: |
          mkdir -p www/build/storybook
          cp -r storybook/* www/build/storybook/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/build

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
